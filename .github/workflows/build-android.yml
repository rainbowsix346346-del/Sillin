name: Build Signed Sillon APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies & Capacitor
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps

      - name: Build web assets
        run: npm run build

      - name: Initialize & Configure Android Platform
        run: |
          npx cap add android
          node scripts/setup-android.mjs
          npx cap sync android

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v -keystore sillon-release.keystore -alias sillonkey -keyalg RSA -keysize 2048 -validity 10000 -storepass Sillon2026Pass -keypass Sillon2026Pass -dname "CN=Hossein Hamidi, OU=Sillon, O=Sillon, L=Ahvaz, ST=Khuzestan, C=IR"

      - name: Build & Sign Release APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease
          cd ..
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore sillon-release.keystore -storepass Sillon2026Pass -keypass Sillon2026Pass android/app/build/outputs/bundle/release/app-release.aab sillonkey
          cp android/app/build/outputs/bundle/release/app-release.aab Sillon-Myket-Signed.aab
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk Sillon-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks sillon-release.keystore --ks-key-alias sillonkey --ks-pass pass:Sillon2026Pass --key-pass pass:Sillon2026Pass --out Sillon-Phone-Signed.apk Sillon-aligned.apk

      - name: Upload Signed APK & AAB + Keystore
        uses: actions/upload-artifact@v4
        with:
          name: Sillon-Android-Release
          path: |
            Sillon-Phone-Signed.apk
            Sillon-Myket-Signed.aab
            sillon-release.keystore
