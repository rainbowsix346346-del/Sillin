name: Build & Release Sillon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install --legacy-peer-deps

      - name: Build web assets and prepare Android project
        run: node scripts/setup-android.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare artifacts
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Sillon-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab out/Sillon-release.aab

      - name: Upload artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: sillon-signed-build
          path: out/

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: سیلون ${{ github.ref_name }}
          body: |
            # سیلون (Sillon) — نسخه جدید

            ## دانلود
            - `Sillon-release.apk` — نصب مستقیم / مارکت‌های ایرانی (بازار، مایکت)
            - `Sillon-release.aab` — گوگل‌پلی
          files: |
            out/Sillon-release.apk
            out/Sillon-release.aab
          draft: false
          prerelease: false
